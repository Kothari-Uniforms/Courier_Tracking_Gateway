<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kothari Uniforms - Tracking</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="loading-card">

    <img
        src="assets/kothari-logo.jpg"
        alt="Kothari Uniforms"
        class="logo"
    >

    <h1 id="title">Loading Details...</h1>

    <h2 id="subtitle">कृपया प्रतीक्षा करें...</h2>

    <div id="loader" class="loader"></div>

    <div class="details">

        <p>
            <strong>Courier:</strong>
            <span id="courier">-</span>
        </p>

        <p>
            <strong>Docket Number:</strong>
            <span id="tracking">-</span>
        </p>

    </div>

        <div id="message" class="message">
            Please wait while we fetch your shipment details.
        </div>

    </div>

    <script src="js/router.js"></script>
    <script src="js/redirect.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
