<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kothari Uniforms - Tracking</title>
    <!-- =========================================================
     APPEND: SOCIAL / WHATSAPP LINK PREVIEW
     Common preview for ALL courier tracking links
     ========================================================= -->

        <meta property="og:type" content="website">

        <meta property="og:title"
            content="Kothari Uniforms - Shipment Tracking Gateway">

        <meta property="og:description"
            content="Track your Kothari Uniforms shipment with Just a Click">

        <meta property="og:image"
            content="https://kothari-uniforms.github.io/Courier_Tracking_Gateway/assets/KUPL_Tracking_SI.jpg">

        <meta property="og:image:alt"
            content="Kothari Uniforms - Shipment Tracking Gateway">

        <meta name="twitter:card"
            content="summary_large_image">

        <meta name="twitter:title"
            content="Kothari Uniforms - Shipment Tracking Gateway">

        <meta name="twitter:description"
            content="Track your Kothari Uniforms shipment with Just a Click">

        <meta name="twitter:image"
            content="https://kothari-uniforms.github.io/Courier_Tracking_Gateway/assets/KUPL_Tracking_SI.jpg">

    <!-- =========================================================
     END APPEND: SOCIAL / WHATSAPP LINK PREVIEW
     ========================================================= -->

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="loading-card">

    <img
        src="assets/kothari-logo.jpg"
        alt="Kothari Uniforms"
        class="logo"
    >

    <h1 id="title">Loading Details...</h1>

    <h2 id="subtitle">कृपया प्रतीक्षा करें...</h2>

    <div id="loader" class="loader"></div>

    <div class="details">

        <p>
            <strong>Courier:</strong>
            <span id="courier">-</span>
        </p>

        <p>
            <strong>Docket Number:</strong>
            <span id="tracking">-</span>
        </p>

    </div>

        <div id="message" class="message">
            Please wait while we fetch your shipment details.
        </div>

    </div>

    <script src="js/router.js"></script>
    <script src="js/redirect.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
